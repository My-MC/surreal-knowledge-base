[workspace]
resolver = "2"
members = ["crates/skb-core", "crates/skb-cli", "crates/skb-mcp"]
exclude = ["spike"]

[workspace.package]
# MSRV: direct deps require 1.88 (rmcp, lopdf, time, serial_test pinned to 3.2.0).
# Transitive max is 1.94 via fastnum (pulled by surrealdb). Uses
# usize::is_multiple_of (stabilized 1.87).
rust-version = "1.88"

[workspace.dependencies]
schemars = { version = "1.2", features = ["derive"] }

[profile.release]
strip = "symbols"
