name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warning-free)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo check
        run: cargo check --workspace
      - name: Serial tests (incl. golden contract tests)
        run: cargo test --workspace -- --test-threads=1
      - name: Check no native-tls / openssl dependency
        run: |
          cargo tree -i openssl-sys 2>&1 | grep -q "did not match"
          cargo tree -i native-tls 2>&1 | grep -q "did not match"
          cargo tree --features ort -p skb-core -i openssl-sys 2>&1 | grep -q "did not match"
          cargo tree --features ort -p skb-core -i native-tls 2>&1 | grep -q "did not match"

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64
            ext: ""
            rustflags: "-C link-arg=-l:libstdc++.a"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64
            ext: ""
            rustflags: "-C link-arg=-l:libstdc++.a"
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: darwin-arm64
            ext: ""
            rustflags: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            pkg: win32-x64
            ext: ".exe"
            rustflags: ""
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target == 'aarch64-apple-darwin' && 'r2' || '' }}
      - name: Cache ONNX Runtime binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ort-cache
          key: ort-pyke-${{ matrix.target }}-${{ hashFiles('crates/skb-core/Cargo.toml') }}
      - name: Suppress dynamic C++ stdlib (Linux)
        if: contains(matrix.target, 'linux')
        run: echo "CXXSTDLIB=" >> $GITHUB_ENV
      - name: Build release (with ort)
        env:
          ORT_CACHE_DIR: ${{ runner.temp }}/ort-cache
        run: cargo build --release -p skb-mcp --features ort --target ${{ matrix.target }}
      - name: Prepare npm package
        shell: bash
        run: |
          mkdir -p npm-out/packages/${{ matrix.pkg }}/bin
          cp npm/packages/${{ matrix.pkg }}/package.json npm-out/packages/${{ matrix.pkg }}/
          cp npm/THIRD_PARTY_LICENSES.md npm-out/packages/${{ matrix.pkg }}/
          cp target/${{ matrix.target }}/release/skb-mcp${{ matrix.ext }} \
             npm-out/packages/${{ matrix.pkg }}/bin/skb-mcp${{ matrix.ext }}
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.pkg }}
          path: npm-out/

  smoke:
    name: Smoke test (linux-x64)
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          name: npm-linux-x64
          path: npm-out/
      - name: Populate npm package with binary
        run: |
          mkdir -p npm/packages/linux-x64/bin
          cp npm-out/packages/linux-x64/bin/skb-mcp npm/packages/linux-x64/bin/
          chmod +x npm/packages/linux-x64/bin/skb-mcp
      - name: Check shared library dependencies
        run: |
          BIN=npm/packages/linux-x64/bin/skb-mcp
          ldd "$BIN"
          for lib in libonnxruntime libssl libcrypto libstdc++; do
            if ldd "$BIN" 2>&1 | grep -q "$lib"; then
              echo "unexpected dynamic dependency: $lib"
              exit 1
            fi
          done
      - name: Check GLIBC floor
        run: |
          echo "Max GLIBC version required:"
          objdump -T npm/packages/linux-x64/bin/skb-mcp | grep -oP 'GLIBC_[0-9.]+' | sort -Vu | tail -1
      - name: Smoke test (pack, install, full MCP flow)
        run: |
          cd "$GITHUB_WORKSPACE/npm" && npm pack
          cd "$GITHUB_WORKSPACE/npm/packages/linux-x64" && npm pack

          SMOKE="$GITHUB_WORKSPACE/target/skb-smoke"
          rm -rf "$SMOKE" && mkdir -p "$SMOKE" && cd "$SMOKE"
          npm init -y >/dev/null 2>&1

          npm install "$GITHUB_WORKSPACE/npm/surreal-knowledge-base-0.1.0.tgz"
          npm install "$GITHUB_WORKSPACE/npm/packages/linux-x64/surreal-knowledge-base-linux-x64-0.1.0.tgz"

          cat > skb.toml << EOF
          [storage]
          path = "../skb-smoke-db"

          [embedding]
          onnx_path = "mock"
          dimension = 8
          tokenizer = "$GITHUB_WORKSPACE/npm/smoke-tokenizer.json"
          EOF

          SKB_BIN="$(dirname "$(node -p "require.resolve('@surreal-knowledge-base/linux-x64/package.json')")")/bin/skb-mcp"
          cd "$SMOKE"

          # Full E2E flow: initialize -> tools/list -> skb_upload -> skb_search
          # (requests are awaited sequentially: rmcp handles them concurrently)
          node "$GITHUB_WORKSPACE/npm/smoke-mcp.mjs" "$SKB_BIN"

      - name: Wrapper launch via node (npx-style) and bun
        run: |
          SMOKE="$GITHUB_WORKSPACE/target/skb-smoke"
          cd "$SMOKE"
          WRAPPER="$(node -p "require.resolve('surreal-knowledge-base/bin/skb-mcp.js')")"
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"node-wrapper","version":"1.0"}}}' \
            | node "$WRAPPER" 2>node.log | head -1 | grep -q 'protocolVersion' \
            || { echo "node wrapper launch failed; stderr:"; cat node.log; exit 1; }
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"bun-wrapper","version":"1.0"}}}' \
            | bun "$WRAPPER" 2>bun.log | head -1 | grep -q 'protocolVersion' \
            || { echo "bun wrapper launch failed; stderr:"; cat bun.log; exit 1; }

  e2e-linux-arm64:
    name: E2E (linux-arm64)
    runs-on: ubuntu-24.04-arm
    needs: build
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: npm-linux-arm64
          path: npm-out/
      - name: Check shared library dependencies
        run: |
          BIN=npm-out/packages/linux-arm64/bin/skb-mcp
          chmod +x "$BIN"
          ldd "$BIN"
          for lib in libonnxruntime libssl libcrypto libstdc++; do
            if ldd "$BIN" 2>&1 | grep -q "$lib"; then
              echo "unexpected dynamic dependency: $lib"
              exit 1
            fi
          done
      - name: MCP E2E flow (initialize -> tools/list -> upload -> search)
        run: |
          cat > skb.toml << EOF
          [storage]
          path = "db"
          [embedding]
          onnx_path = "mock"
          dimension = 8
          tokenizer = "$GITHUB_WORKSPACE/npm/smoke-tokenizer.json"
          EOF
          node "$GITHUB_WORKSPACE/npm/smoke-mcp.mjs" "$PWD/npm-out/packages/linux-arm64/bin/skb-mcp"

  e2e-macos:
    name: E2E (darwin-arm64)
    runs-on: macos-latest
    needs: build
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: npm-darwin-arm64
          path: npm-out/
      - name: Check dynamic library dependencies (otool)
        run: |
          BIN=npm-out/packages/darwin-arm64/bin/skb-mcp
          chmod +x "$BIN"
          otool -L "$BIN"
          if otool -L "$BIN" 2>&1 | grep -q libonnxruntime; then
            echo "libonnxruntime must not be linked"
            exit 1
          fi
      - name: MCP E2E flow (initialize -> tools/list -> upload -> search)
        run: |
          cat > skb.toml << EOF
          [storage]
          path = "db"
          [embedding]
          onnx_path = "mock"
          dimension = 8
          tokenizer = "$GITHUB_WORKSPACE/npm/smoke-tokenizer.json"
          EOF
          node "$GITHUB_WORKSPACE/npm/smoke-mcp.mjs" "$PWD/npm-out/packages/darwin-arm64/bin/skb-mcp"

  e2e-windows:
    name: E2E (win32-x64)
    runs-on: windows-2022
    needs: build
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: npm-win32-x64
          path: npm-out/
      - name: Check imported DLLs (VC++ runtime prerequisite)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin not found"; exit 1 }
          $deps = & $dumpbin.FullName /dependents npm-out\packages\win32-x64\bin\skb-mcp.exe
          $deps | Select-String '\.dll'
          if ($deps | Select-String 'libonnxruntime') { Write-Error "libonnxruntime.dll must not be imported"; exit 1 }
          if (-not ($deps | Select-String 'MSVCP140.dll')) { Write-Error "MSVCP140.dll (VC++ runtime) must be imported"; exit 1 }
          if (-not ($deps | Select-String 'VCRUNTIME140.dll')) { Write-Error "VCRUNTIME140.dll (VC++ runtime) must be imported"; exit 1 }
          Write-Output "VC++ runtime present on runner: $(Test-Path "$env:WINDIR\System32\vcruntime140.dll")"
      - name: MCP E2E flow (initialize -> tools/list -> upload -> search)
        shell: pwsh
        run: |
          $tok = (Join-Path $env:GITHUB_WORKSPACE "npm\smoke-tokenizer.json").Replace('\', '/')
          @"
          [storage]
          path = "db"
          [embedding]
          onnx_path = "mock"
          dimension = 8
          tokenizer = "$tok"
          "@ | Set-Content -Encoding ascii skb.toml
          node "$env:GITHUB_WORKSPACE/npm/smoke-mcp.mjs" "$env:GITHUB_WORKSPACE/npm-out/packages/win32-x64/bin/skb-mcp.exe"
