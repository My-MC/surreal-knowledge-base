name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -- --test-threads=1
      - name: Check no native-tls / openssl dependency
        run: |
          cargo tree -i openssl-sys 2>&1 | grep -q "did not match"
          cargo tree -i native-tls 2>&1 | grep -q "did not match"
          cargo tree --features ort -p skb-core -i openssl-sys 2>&1 | grep -q "did not match"
          cargo tree --features ort -p skb-core -i native-tls 2>&1 | grep -q "did not match"

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            pkg: linux-x64
            ext: ""
            rustflags: "-C link-arg=-static-libstdc++ -C link-arg=-static-libgcc"
            cc: cc
            cxx: c++
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            pkg: linux-arm64
            ext: ""
            rustflags: "-C link-arg=-static-libstdc++ -C link-arg=-static-libgcc"
            cc: cc
            cxx: c++
          - os: macos-13
            target: x86_64-apple-darwin
            pkg: darwin-x64
            ext: ""
            rustflags: ""
            cc: cc
            cxx: c++
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: darwin-arm64
            ext: ""
            rustflags: ""
            cc: cc
            cxx: c++
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            pkg: win32-x64
            ext: ".exe"
            rustflags: "-C target-feature=+crt-static"
            cc: cc
            cxx: c++
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Cache ONNX Runtime binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-pyke-${{ matrix.target }}-${{ hashFiles('crates/skb-core/Cargo.toml') }}
      - name: Build release (with ort)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cargo build --release -p skb-mcp --features ort --target ${{ matrix.target }}
      - name: Prepare npm package
        shell: bash
        run: |
          mkdir -p npm-out/packages/${{ matrix.pkg }}/bin
          cp npm/packages/${{ matrix.pkg }}/package.json npm-out/packages/${{ matrix.pkg }}/
          cp npm/THIRD_PARTY_LICENSES.md npm-out/packages/${{ matrix.pkg }}/
          cp target/${{ matrix.target }}/release/skb-mcp${{ matrix.ext }} \
             npm-out/packages/${{ matrix.pkg }}/bin/skb-mcp${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.pkg }}
          path: npm-out/

  smoke:
    name: Smoke test (linux-x64)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-linux-x64
          path: npm-out/
      - name: Populate npm package with binary
        run: |
          mkdir -p npm/packages/linux-x64/bin
          cp npm-out/packages/linux-x64/bin/skb-mcp npm/packages/linux-x64/bin/
      - name: Check shared library dependencies
        run: |
          ldd npm/packages/linux-x64/bin/skb-mcp
          ldd npm/packages/linux-x64/bin/skb-mcp 2>&1 | (! grep -q libonnxruntime)
          ldd npm/packages/linux-x64/bin/skb-mcp 2>&1 | (! grep -q libssl)
          ldd npm/packages/linux-x64/bin/skb-mcp 2>&1 | (! grep -q libcrypto)
          ldd npm/packages/linux-x64/bin/skb-mcp 2>&1 | (! grep -q libstdc++)
      - name: Check GLIBC floor
        run: |
          echo "Max GLIBC version required:"
          objdump -T npm/packages/linux-x64/bin/skb-mcp | grep -oP 'GLIBC_[0-9.]+' | sort -Vu | tail -1
      - name: Smoke test (pack, install, MCP handshake)
        run: |
          cd "$GITHUB_WORKSPACE/npm" && npm pack
          cd "$GITHUB_WORKSPACE/npm/packages/linux-x64" && npm pack

          SMOKE="$GITHUB_WORKSPACE/target/skb-smoke"
          rm -rf "$SMOKE" && mkdir -p "$SMOKE" && cd "$SMOKE"
          npm init -y >/dev/null 2>&1

          npm install "$GITHUB_WORKSPACE/npm/surreal-knowledge-base-0.1.0.tgz"
          npm install "$GITHUB_WORKSPACE/npm/packages/linux-x64/surreal-knowledge-base-linux-x64-0.1.0.tgz"

          cat > skb.toml << 'EOF'
          [storage]
          path = "../skb-smoke-db"

          [embedding]
          onnx_path = "mock"
          dimension = 8
          EOF

          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke-test","version":"1.0"}}}' \
            | node node_modules/surreal-knowledge-base/bin/skb-mcp.js 2>/dev/null \
            | head -1 \
            | grep -q "protocolVersion"
