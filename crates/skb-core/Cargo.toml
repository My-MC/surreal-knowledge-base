[package]
name = "skb-core"
version = "0.1.0"
edition = "2021"
description = "Surreal Knowledge Base - core library"

[features]
default = []
ort = ["dep:ort", "dep:ndarray"]

[dependencies]
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig", "progressbar"] }
hf-hub = { version = "1", features = ["blocking"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = [
  "std", "ndarray", "tracing", "download-binaries", "tls-rustls",
  "copy-dylibs", "api-27",
], optional = true }
ndarray = { version = "0.17", optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
schemars = { version = "0.8", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
anyhow = "1"
ureq = "3"
base64 = "0.23"
regex = "1"
pdf-extract = "0.12"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "skb"
harness = false
