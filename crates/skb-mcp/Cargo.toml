[package]
name = "skb-mcp"
version = "0.1.0"
edition = "2021"
# MSRV: uses usize::is_multiple_of (stabilized 1.87); CI pins the stable toolchain.
rust-version = "1.87"
description = "Surreal Knowledge Base - MCP server"

[[bin]]
name = "skb-mcp"
path = "src/main.rs"

[features]
default = []
ort = ["skb-core/ort"]

[dependencies]
skb-core = { path = "../skb-core" }
rmcp = { version = "3.0", features = ["transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { workspace = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
