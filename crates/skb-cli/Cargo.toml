[package]
name = "skb"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Surreal Knowledge Base - CLI"

[[bin]]
name = "skb"
path = "src/main.rs"

[features]
default = []
ort = ["skb-core/ort"]

[dependencies]
skb-core = { path = "../skb-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = "1"
serde_json = "1"
anyhow = "1"
toml = "1.1"
toml_edit = "0.25"
glob = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# serial_test 4.x declares rust-version = "1.93.1", which would force the
# workspace MSRV up. Pin to the latest 3.x (which supports Rust 1.68.2 per
# upstream README) so MSRV stays at the direct-deps floor (1.88).
# Exact pin (=) mirrors the ureq policy in skb-core/Cargo.toml and blocks
# silent jumps to 4.x when a transitive resolver picks a newer minor.
serial_test = "=4.0.1"
